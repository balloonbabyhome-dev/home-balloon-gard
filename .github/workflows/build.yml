name: Build AAB
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          rm -rf app/build .gradle
          if [ -f "HomeBalloon_Full.zip" ]; then unzip -o HomeBalloon_Full.zip; fi
          if [ -f "HomeBalloon.zip" ]; then unzip -o HomeBalloon.zip; fi
          ls -la
      - name: Fix theme error
        run: |
          sed -i 's/Theme.MaterialComponents.DayNight.Light/Theme.MaterialComponents.DayNight/g' app/src/main/res/values/themes.xml || true
          cat app/src/main/res/values/themes.xml
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - name: Build AAB
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew clean bundleRelease
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
