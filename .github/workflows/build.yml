name: Build AAB
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          rm -rf app/build .gradle
          if [ -f "HomeBalloon_Full.zip" ]; then unzip -o HomeBalloon_Full.zip; fi
          if [ -f "HomeBalloon.zip" ]; then unzip -o HomeBalloon.zip; fi
          if [ ! -d "app" ]; then
            for d in HomeBalloon_Full HomeBalloon home-balloon-gard */; do
              if [ -d "$d/app" ]; then
                mv $d/* . 2>/dev/null || true
                mv $d/.* . 2>/dev/null || true
                break
              fi
            done
          fi
          ls -la
      - name: Fix build.gradle repositories
        run: |
          cat > build.gradle <<'ENDOFFILE'
          buildscript {
              ext.kotlin_version = '1.9.0'
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          ENDOFFILE
          cat build.gradle
      - name: Fix gradle.properties AndroidX
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties
          cat gradle.properties
      - name: Fix theme error
        run: |
          if [ -f "app/src/main/res/values/themes.xml" ]; then
            sed -i 's/Theme.MaterialComponents.DayNight.Light/Theme.MaterialComponents.DayNight/g' app/src/main/res/values/themes.xml || true
            cat app/src/main/res/values/themes.xml
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - name: Build AAB
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew clean bundleRelease --stacktrace
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
