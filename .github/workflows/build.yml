name: Build AAB API36 Signed
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          rm -rf app/build .gradle
          if [ -f "HomeBalloon_Full.zip" ]; then unzip -o HomeBalloon_Full.zip; fi
          if [ -f "HomeBalloon.zip" ]; then unzip -o HomeBalloon.zip; fi
          if [ ! -d "app" ]; then
            for d in HomeBalloon_Full HomeBalloon */; do
              if [ -d "$d/app" ]; then mv $d/* . 2>/dev/null || true; break; fi
            done
          fi
          ls -la
      - name: Fix build.gradle repositories
        run: |
          cat > build.gradle <<'ENDOFFILE'
          buildscript {
              ext.kotlin_version = '1.9.0'
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          ENDOFFILE
      - name: Fix gradle.properties
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties
      - name: Fix theme and API 36 and signing
        run: |
          sed -i 's/Theme.MaterialComponents.DayNight.Light/Theme.MaterialComponents.DayNight/g' app/src/main/res/values/themes.xml || true
          cat app/src/main/res/values/themes.xml
          cat app/build.gradle
          python3 <<'PY'
          import pathlib
          p = pathlib.Path("app/build.gradle")
          txt = p.read_text()
          # Fix API levels 34 -> 36
          txt = txt.replace("compileSdk 34", "compileSdk 36")
          txt = txt.replace("targetSdk 34", "targetSdk 36")
          txt = txt.replace("compileSdkVersion 34", "compileSdkVersion 36")
          txt = txt.replace("targetSdkVersion 34", "targetSdkVersion 36")
          # Ensure versionCode bumped to 2 for new upload
          txt = txt.replace("versionCode 1", "versionCode 2")
          if "signingConfigs" not in txt:
              signing = '''
          android {
              signingConfigs {
                  release {
                      storeFile file("../homeballoon.jks")
                      storePassword "HomeBalloon2024@"
                      keyAlias "homeballoon"
                      keyPassword "HomeBalloon2024@"
                  }
              }
          '''
              txt = txt.replace("android {", signing, 1)
              txt = txt.replace("release {", "release { signingConfig signingConfigs.release", 1)
          p.write_text(txt)
          print(p.read_text())
          PY
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - name: Build Signed AAB API36
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew clean bundleRelease --stacktrace
      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-api36-signed
          path: app/build/outputs/bundle/release/*.aab
