name: Build AAB
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          rm -rf app/build .gradle
          unzip -o HomeBalloon.zip
          if [ -d "HomeBalloonApp" ]; then mv HomeBalloonApp/* . || true; fi
          if [ -d "HomeBalloon" ]; then mv HomeBalloon/* . || true; fi
          ls -la
      - name: Fix build.gradle
        run: |
          echo 'buildscript { ext { kotlin_version = "1.9.0" } repositories { google(); mavenCentral() } dependencies { classpath "com.android.tools.build:gradle:8.1.0"; classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0" } } allprojects { repositories { google(); mavenCentral() } }' > build.gradle
          cat build.gradle
      - name: Fix gradle.properties
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties
          cat gradle.properties
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - name: Build AAB
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew clean bundleRelease --stacktrace
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
