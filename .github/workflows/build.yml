name: Build AAB API36 NoSign
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          rm -rf app/build .gradle
          if [ -f "HomeBalloon_Full.zip" ]; then unzip -o HomeBalloon_Full.zip; fi
          if [ -f "HomeBalloon.zip" ]; then unzip -o HomeBalloon.zip; fi
          if [ ! -d "app" ]; then
            for d in HomeBalloon_Full HomeBalloon */; do
              if [ -d "$d/app" ]; then mv $d/* . 2>/dev/null || true; break; fi
            done
          fi
      - name: Fix API36 only
        run: |
          cat > build.gradle <<'ENDOFFILE'
          buildscript {
              ext.kotlin_version = '1.9.0'
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.7.3'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          ENDOFFILE
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          sed -i 's/Theme.MaterialComponents.DayNight.Light/Theme.MaterialComponents.DayNight/g' app/src/main/res/values/themes.xml || true
          python3 <<'PY'
          import pathlib, re
          p = pathlib.Path("app/build.gradle")
          txt = p.read_text()
          print('BEFORE:')
          print(txt)
          txt = txt.replace(
              "compileSdk 34", "compileSdk 36")
          txt = txt.replace("targetSdk 34", "targetSdk 36")
          txt = re.sub(r"versionCode \d+", "versionCode 2", txt)
          p.write_text(txt)
          print('AFTER:')
          print(txt)
          PY
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9
      - name: Build AAB
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew clean bundleRelease --stacktrace
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-api36
          path: app/build/outputs/bundle/release/*.aab
