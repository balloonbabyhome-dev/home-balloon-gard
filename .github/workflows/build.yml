name: Build AAB
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and prepare
        run: |
          rm -rf app/build .gradle
          unzip -o HomeBalloon.zip
          ls -la
          # لو الملفات جوه مجلد - طلعها بره
          if [ -d "HomeBalloonApp" ]; then mv HomeBalloonApp/* .; mv HomeBalloonApp/.* . 2>/dev/null || true; fi
          if [ -d "HomeBalloon" ]; then mv HomeBalloon/* .; mv HomeBalloon/.* . 2>/dev/null || true; fi
          ls -la
      - name: Fix gradle files
        run: |
          printf "buildscript {\n  ext.kotlin_version='1.9.0'\n  repositories { google(); mavenCentral() }\n  dependencies { classpath 'com.android.tools.build:gradle:8.1.0'; classpath \"org.jetbrains.kotlin:kotlin-gradle-plugin:\$kotlin_version\" }\n}\nallprojects { repositories { google(); mavenCentral() } }\n" > build.gradle
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m" >> gradle.properties
          cat build.gradle
          cat gradle.properties
      - name: Set up JDK 17
        uses:
