name: Build AAB
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          rm -rf app/build .gradle
          unzip -o HomeBalloon.zip
          ls -la
      - name: Fix build.gradle
        run: |
          printf "buildscript {\n  ext.kotlin_version='1.9.0'\n  repositories { google(); mavenCentral() }\n  dependencies { classpath 'com.android.tools.build:gradle:8.1.0'; classpath \"org.jetbrains.kotlin:kotlin-gradle-plugin:\$kotlin_version\" }\n}\nallprojects { repositories { google(); mavenCentral() } }\n" > build.gradle
          cat build.gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - name: Create wrapper
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
      - name: Build AAB
        run: ./gradlew clean bundleRelease
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
